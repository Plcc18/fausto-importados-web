<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="coroa.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fausto Importados</title>
    <script>
      // Mesmo critério do useTheme: escolha salva > tema do sistema (aplicado antes do primeiro paint)
      try {
        var t = localStorage.getItem("theme");
        var dark = t === "dark" || t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
